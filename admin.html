<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Excellentia Digital Academy</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f5f9;
  color: #222;
}

.header {
  background: #075e54;
  color: white;
  text-align: center;
  padding: 24px 15px;
  border-radius: 0 0 25px 25px;
}

.header h1 {
  margin: 0;
  font-size: 24px;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  margin-top: 20px;
  padding: 24px;
  border-radius: 18px;
  box-shadow: 0 3px 15px rgba(0,0,0,0.08);
}

.hidden {
  display: none;
}

input {
  width: 100%;
  padding: 15px;
  margin: 10px 0;
  border: 1px solid #ccc;
  border-radius: 9px;
  font-size: 17px;
}

button {
  padding: 12px 20px;
  border: none;
  border-radius: 9px;
  background: #075e54;
  color: white;
  font-size: 15px;
  cursor: pointer;
}

button:hover {
  background: #064c44;
}

.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 15px;
}

.stats {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.stat-box {
  background: #e8f5f3;
  padding: 14px 18px;
  border-radius: 12px;
  flex: 1;
  min-width: 120px;
  text-align: center;
}

.stat-box .num {
  font-size: 24px;
  font-weight: bold;
  color: #075e54;
}

.stat-box .label {
  font-size: 13px;
  color: #555;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}

th, td {
  text-align: left;
  padding: 10px 8px;
  border-bottom: 1px solid #eee;
  white-space: nowrap;
}

th {
  background: #f5f5f5;
  color: #075e54;
  position: sticky;
  top: 0;
}

.table-wrap {
  overflow-x: auto;
}

.pass {
  color: #1a7a1a;
  font-weight: bold;
}

.fail {
  color: #b71c1c;
  font-weight: bold;
}

.loading {
  text-align: center;
  padding: 30px;
  color: #075e54;
}

.error-box {
  background: #fdecea;
  color: #b71c1c;
  padding: 15px;
  border-radius: 10px;
  margin: 15px 0;
}
</style>
</head>

<body>

<div class="header">
  <h1>Admin Dashboard</h1>
  <p style="margin:8px 0 0;">Excellentia Digital Academy</p>
</div>

<div class="container">

<!-- LOGIN -->
<div id="loginPage" class="card">
  <h2 style="color:#075e54; margin-top:0;">Admin Login</h2>
  <p>Enter the admin password to view results.</p>
  <input type="password" id="passwordInput" placeholder="Password">
  <button onclick="checkPassword()" style="width:100%;">Login</button>
  <p id="loginError" class="error-box hidden">Incorrect password.</p>
</div>

<!-- DASHBOARD -->
<div id="dashboardPage" class="card hidden">

  <div class="top-bar">
    <h2 style="color:#075e54; margin:0;">All Results</h2>
    <div>
      <button onclick="loadResults()">Refresh</button>
      <button onclick="exportCSV()">Export CSV</button>
    </div>
  </div>

  <div class="stats" id="statsBar"></div>

  <input type="text" id="searchBox" placeholder="Search by student name or subject..." oninput="renderTable()">

  <div id="tableContainer" class="table-wrap">
    <div class="loading">Loading results...</div>
  </div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://ilealjmhymujcoolptbe.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_eyZTQOA0_mLdxqVH3LUmvw_gsll1hBi";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const ADMIN_PASSWORD = "08110091174Ali";

let allResults = [];

function checkPassword() {

  const entered = document.getElementById("passwordInput").value;

  if (entered === ADMIN_PASSWORD) {
    document.getElementById("loginPage").classList.add("hidden");
    document.getElementById("dashboardPage").classList.remove("hidden");
    loadResults();
  } else {
    document.getElementById("loginError").classList.remove("hidden");
  }

}

// Allow pressing Enter to login
document.addEventListener("DOMContentLoaded", () => {
  const input = document.getElementById("passwordInput");
  input.addEventListener("keyup", (e) => {
    if (e.key === "Enter") checkPassword();
  });
});

async function loadResults() {

  const container = document.getElementById("tableContainer");
  container.innerHTML = '<div class="loading">Loading results...</div>';

  try {

    const { data, error } = await sb
      .from("results")
      .select("*")
      .order("submitted_at", { ascending: false });

    if (error) throw error;

    allResults = data || [];

    renderStats();
    renderTable();

  } catch (err) {

    console.error(err);
    container.innerHTML = '<div class="error-box">Could not load results: ' + (err.message || 'unknown error') + '</div>';

  }

}

function renderStats() {

  const statsBar = document.getElementById("statsBar");

  const totalTests = allResults.length;
  const avgPercentage = totalTests > 0
    ? Math.round(allResults.reduce((sum, r) => sum + r.percentage, 0) / totalTests)
    : 0;
  const uniqueStudents = new Set(allResults.map(r => r.student_name)).size;

  statsBar.innerHTML = `
    <div class="stat-box">
      <div class="num">${totalTests}</div>
      <div class="label">Total Tests</div>
    </div>
    <div class="stat-box">
      <div class="num">${uniqueStudents}</div>
      <div class="label">Students</div>
    </div>
    <div class="stat-box">
      <div class="num">${avgPercentage}%</div>
      <div class="label">Average Score</div>
    </div>
  `;

}

function renderTable() {

  const container = document.getElementById("tableContainer");
  const search = document.getElementById("searchBox").value.toLowerCase();

  const filtered = allResults.filter(r =>
    (r.student_name || "").toLowerCase().includes(search) ||
    (r.subject_name || "").toLowerCase().includes(search)
  );

  if (filtered.length === 0) {
    container.innerHTML = '<div class="loading">No results found.</div>';
    return;
  }

  let html = `
    <table>
      <thead>
        <tr>
          <th>Student</th>
          <th>Subject</th>
          <th>Score</th>
          <th>Percentage</th>
          <th>Result</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody>
  `;

  filtered.forEach(r => {
    const date = r.submitted_at
      ? new Date(r.submitted_at).toLocaleString()
      : "";
    const passClass = r.percentage >= 50 ? "pass" : "fail";
    const passLabel = r.percentage >= 50 ? "Pass" : "Fail";

    html += `
      <tr>
        <td>${r.student_name || ""}</td>
        <td>${r.subject_name || ""}</td>
        <td>${r.score} / ${r.total_questions}</td>
        <td>${r.percentage}%</td>
        <td class="${passClass}">${passLabel}</td>
        <td>${date}</td>
      </tr>
    `;
  });

  html += "</tbody></table>";

  container.innerHTML = html;

}

function exportCSV() {

  if (allResults.length === 0) {
    alert("No results to export.");
    return;
  }

  let csv = "Student,Subject,Score,Total,Percentage,Result,Date\n";

  allResults.forEach(r => {
    const date = r.submitted_at ? new Date(r.submitted_at).toLocaleString() : "";
    const result = r.percentage >= 50 ? "Pass" : "Fail";
    csv += `"${r.student_name || ""}","${r.subject_name || ""}",${r.score},${r.total_questions},${r.percentage}%,${result},"${date}"\n`;
  });

  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "cbt_results.csv";
  a.click();
  URL.revokeObjectURL(url);

}

</script>

</body>
</html>
