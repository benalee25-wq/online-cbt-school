<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Excellentia Digital Academy</title>

<meta name="description" content="Excellentia Digital Academy - Learn. Grow. Succeed.">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, sans-serif;
    background:#f5f7fa;
    color:#222;
    line-height:1.6;
}

a{
    text-decoration:none;
    color:inherit;
}

.header{
    background:#075e54;
    color:white;
    padding:18px 20px;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.header-inner{
    max-width:1100px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:21px;
    font-weight:bold;
}

.menu-btn{
    background:transparent;
    border:0;
    color:white;
    font-size:28px;
    width:auto;
    padding:0;
    margin:0;
}

.nav{
    display:none;
    background:#064c44;
    margin-top:15px;
    border-radius:10px;
    overflow:hidden;
}

.nav a{
    display:block;
    padding:13px 15px;
    color:white;
    border-bottom:1px solid rgba(255,255,255,.1);
}

.nav.show{
    display:block;
}

.hero{
    background:linear-gradient(135deg,#075e54,#0a8f7f);
    color:white;
    text-align:center;
    padding:60px 20px;
}

.hero h1{
    font-size:34px;
    margin-bottom:12px;
}

.hero .tagline{
    font-size:22px;
    font-weight:bold;
    margin-bottom:12px;
}

.hero p{
    max-width:650px;
    margin:0 auto 25px;
    font-size:17px;
}

.btn{
    display:inline-block;
    background:white;
    color:#075e54;
    padding:14px 24px;
    border-radius:10px;
    font-weight:bold;
    border:none;
    cursor:pointer;
