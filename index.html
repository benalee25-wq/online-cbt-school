        <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excellentia Digital Academy - CBT</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f5f9;
  color: #222;
}

.header {
  background: #075e54;
  color: white;
  text-align: center;
  padding: 28px 15px;
  border-radius: 0 0 25px 25px;
}

.header h1 {
  margin: 0;
  font-size: 28px;
}

.header p {
  font-size: 18px;
  margin: 10px 0 0;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  margin-top: 20px;
  padding: 28px;
  border-radius: 18px;
  box-shadow: 0 3px 15px rgba(0,0,0,0.08);
}

.hidden {
  display: none;
}

h2 {
  color: #075e54;
}

input,
select {
  width: 100%;
  padding: 15px;
  margin: 10px 0;
  border: 1px solid #ccc;
  border-radius: 9px;
  font-size: 17px;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 12px;
  border: none;
  border-radius: 9px;
  background: #075e54;
  color: white;
  font-size: 17px;
  cursor: pointer;
}

button:hover {
  background: #064c44;
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.timer {
  background: #fff3cd;
  color: #856404;
  padding: 15px;
  border-radius: 10px;
  text-align: center;
  font-size: 21px;
  font-weight: bold;
  margin-bottom: 22px;
}

.subject-box {
  border: 2px solid #e0e0e0;
  padding: 18px;
  margin: 12px 0;
  border-radius: 12px;
  cursor: pointer;
  background: #fafafa;
}

.subject-box:hover {
  border-color: #075e54;
  background: #e8f5f3;
}

.question-number {
  color: #075e54;
  font-weight: bold;
  font-size: 18px;
}

.option {
  display: block;
  background: #f5f5f5;
  padding: 16px;
  margin: 11px 0;
  border-radius: 10px;
  cursor: pointer;
  font-size: 17px;
}

.option:hover {
  background: #e8f5f3;
}

.option input {
  width: auto;
  margin-right: 10px;
}

.result {
  text-align: center;
}

.score {
  font-size: 42px;
  font-weight: bold;
  color: #075e54;
}

.info {
  background: #e8f5f3;
  padding: 15px;
  border-radius: 10px;
  margin: 15px 0;
}

.loading {
  text-align: center;
  padding: 30px;
  color: #075e54;
}

.error-box {
  background: #fdecea;
  color: #b71c1c;
  padding: 15px;
  border-radius: 10px;
  margin: 15px 0;
}
</style>
</head>

<body>

<div class="header">
  <h1>Excellentia Digital Academy</h1>
  <p>Computer Based Test (CBT)</p>
</div>

<div class="container">

<div id="startPage" class="card">

  <h2>Welcome to the CBT</h2>

  <p>Please enter your full name to continue.</p>

  <input
    type="text"
    id="studentName"
    placeholder="Enter your full name"
  >

  <button onclick="continueToSubjects()" id="startButton">
    Continue
  </button>

</div>


<div id="subjectPage" class="card hidden">

  <h2>Select Your Subject</h2>

  <p>
    Welcome, <strong id="displayName"></strong>.
  </p>

  <div class="info">
    Select the subject you want to write.
  </div>

  <div id="subjectList">
    <div class="loading">Loading subjects...</div>
  </div>

</div>


<div id="testPage" class="card hidden">

  <div class="info">
    <strong>Student:</strong>
    <span id="testStudent"></span>
    <br>
    <strong>Subject:</strong>
    <span id="testSubject"></span>
  </div>

  <div class="timer">
    Time Remaining:
    <span id="timer">10:00</span>
  </div>

  <div id="questionContainer"></div>

  <button onclick="nextQuestion()" id="nextButton">
    Next Question
  </button>

</div>


<div id="resultPage" class="card result hidden">

  <h2>Test Completed!</h2>

  <p id="studentResult"></p>

  <p id="subjectResult"></p>

  <p>Your Score</p>

  <div class="score" id="score"></div>

  <p id="percentage"></p>

  <p id="message"></p>

  <p id="saveStatus" style="font-size: 14px; color: #666;"></p>

  <button onclick="location.reload()">
    Take Another Test
  </button>

</div>

</div>

<script>

const SUPABASE_ANON_KEY = "sb_publishable_eyZTQOA0_mLdxqVH3LUmvw_gsll1hBi";

const sb = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

let studentName = "";
let candidateId = null;

let selectedSubject = "";
let selectedSubjectId = null;

let subjectsCache = [];
let questions = [];

let currentQuestion = 0;
let score = 0;
let timeLeft = 600;
let timerInterval;

async function continueToSubjects() {

  studentName = document.getElementById("studentName").value.trim();

  if (studentName === "") {
    alert("Please enter your full name.");
    return;
  }

  const startButton = document.getElementById("startButton");
  startButton.disabled = true;
  startButton.textContent = "Please wait...";

  try {

    const { data, error } = await sb
      .from("candidates")
      .insert({ full_name: studentName })
      .select()
      .single();

    if (error) throw error;

    candidateId = data.id;

    document.getElementById("displayName").textContent = studentName;

    document.getElementById("startPage").classList.add("hidden");
    document.getElementById("subjectPage").classList.remove("hidden");

    loadSubjects();

  } catch (err) {

    console.error(err);
    alert("Could not start the test.\n\nDetails: " + (err.message || JSON.stringify(err)));

  } finally {

    startButton.disabled = false;
    startButton.textContent = "Continue";

  }

}

async function loadSubjects() {

  const listEl = document.getElementById("subjectList");

  try {

    const { data, error } = await sb
      .from("subjects")
      .select("id, name")
      .order("name");

    if (error) throw error;

    if (!data || data.length === 0) {
      listEl.innerHTML = '<div class="error-box">No subjects found. Please contact the administrator.</div>';
      return;
    }

    subjectsCache = data;

    const icons = {
      "Mathematics": "📐",
      "English": "📖",
      "Biology": "🧬",
      "Chemistry": "⚗️",
      "Physics": "⚡",
      "Computer Studies": "💻"
    };

    listEl.innerHTML = data.map(subject => `
      <div class="subject-box" onclick="selectSubject('${subject.id}', '${subject.name.replace(/'/g, "\\'")}')">
        ${icons[subject.name] || "📘"} <strong>${subject.name}</strong>
      </div>
    `).join("");

  } catch (err) {

    console.error(err);
    listEl.innerHTML = '<div class="error-box">Could not load subjects: ' + (err.message || 'unknown error') + '</div>';

  }

}

async function selectSubject(subjectId, subjectName) {

  selectedSubjectId = subjectId;
  selectedSubject = subjectName;

  document.getElementById("subjectPage").classList.add("hidden");
  document.getElementById("testPage").classList.remove("hidden");

  document.getElementById("testStudent").textContent = studentName;
  document.getElementById("testSubject").textContent = selectedSubject;

  document.getElementById("questionContainer").innerHTML =
    '<div class="loading">Loading questions...</div>';
  document.getElementById("nextButton").disabled = true;

  try {

    const { data, error } = await sb
      .from("questions")
      .select("*")
      .eq("subject_id", subjectId);

    if (error) throw error;

    if (!data || data.length === 0) {
      document.getElementById("questionContainer").innerHTML =
        '<div class="error-box">No questions found for this subject.</div>';
      return;
    }

    questions = data.map(row => ({
      id: row.id,
      question: row.question,
      options: [row.option_a, row.option_b, row.option_c, row.option_d],
      answer: row.correct_index
    }));

    currentQuestion = 0;
    score = 0;
    timeLeft = 600;

    document.getElementById("nextButton").disabled = false;

    showQuestion();

    timerInterval = setInterval(updateTimer, 1000);

  } catch (err) {

    console.error(err);
    document.getElementById("questionContainer").innerHTML =
      '<div class="error-box">Could not load questions: ' + (err.message || 'unknown error') + '</div>';

  }

}

function showQuestion() {

  const q = questions[currentQuestion];

  let html = `
    <p class="question-number">
      Question ${currentQuestion + 1} of ${questions.length}
    </p>
    <h3>${q.question}</h3>
  `;

  q.options.forEach((option, index) => {
    html += `
      <label class="option">
        <input type="radio" name="answer" value="${index}">
        ${option}
      </label>
    `;
  });

  document.getElementById("questionContainer").innerHTML = html;

  document.getElementById("nextButton").textContent =
    currentQuestion === questions.length - 1 ? "Submit Test" : "Next Question";

}

function nextQuestion() {

  const selected = document.querySelector('input[name="answer"]:checked');

  if (!selected) {
    alert("Please select an answer.");
    return;
  }

  if (parseInt(selected.value) === questions[currentQuestion].answer) {
    score++;
  }

  currentQuestion++;

  if (currentQuestion < questions.length) {
    showQuestion();
  } else {
    finishTest();
  }

}
